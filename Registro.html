<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - LunarMC</title>
    <link rel="stylesheet" href="index-.css">
</head>
<body>

    <table class="header-table">
        <tr>
            <td class="col-spacer"></td>
            <td class="col-main">
                <h1><strong>Menú de la tienda oficial del servidor LunarMC</strong></h1>
                <p class="clickable-ip" onclick="navigator.clipboard.writeText('lunarmc.cc'); alert('¡IP copiada al portapapeles!');">
                    <strong>IP: lunarmc.cc (Haz click para copiar)</strong>
                </p>
            </td>
            <td class="col-register">
                <br>
                <button class="btn-disabled" disabled>
                    <b>Regístrate 🔑</b>
                </button>
            </td>
        </tr>
    </table>

    <main>
        <div class="text-center">
            <br>
            <img src="imagen del servidor lunar.png" alt="foto del server lunar" width="300">
            <h2>LunarMC</h2>
        </div>

        <hr>

        <div class="nav-container">
            <details class="inline-details">
                <summary class="nav-summary">Tridentbox</summary>
                <p>
                    <a href="rangos-tridentbox.html">RANGOS</a> &nbsp;&nbsp; 
                    <a href="extras-tridentbox.html">EXTRAS</a>
                </p>
            </details>
            <span class="nav-spacer"></span>
            <a href="index.html" class="nav-link">Home</a>
            <span class="nav-spacer"></span>
            <a href="Acerca de Nosotros.html" class="nav-link">Acerca de Nosotros</a>
        </div>

        <hr>

        <div class="text-center">
            <form action="#" method="POST">
                <fieldset class="form-fieldset">
                    <legend><h3>Formulario de Registro</h3></legend>
                    
                    <table class="form-table">
                        <tr>
                            <td class="form-label-col"><label for="usuario_mc"><strong>Usuario de Minecraft:</strong></label></td>
                            <td class="form-input-col"><input type="text" id="usuario_mc" name="usuario_mc" size="22" placeholder="Tu nick en el juego" required></td>
                        </tr>
                        <tr>
                            <td class="form-label-col"><label for="password_mc"><strong>Contraseña:</strong></label></td>
                            <td class="form-input-col"><input type="password" id="password_mc" name="password_mc" size="22" placeholder="Mínimo 8 caracteres" minlength="8" required></td>
                        </tr>
                        <tr>
                            <td class="form-label-col"><label for="sexo_mc"><strong>Sexo:</strong></label></td>
                            <td class="form-input-col">
                                <select id="sexo_mc" name="sexo_mc" class="form-select" required>
                                    <option value="" disabled selected>Selecciona una opción</option>
                                    <option value="femenino">Femenino</option>
                                    <option value="masculino">Masculino</option>
                                    <option value="otro">Otro / Prefiero no decirlo</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td class="form-label-col">
                                <a href="index.html" class="form-cancel-link">[Cancelar X]</a>
                            </td>
                            <td class="form-input-col">
                                <button type="submit" class="btn-submit"><strong>Enviar Registro 🚀</strong></button>
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </form>
        </div>

        <hr>

        <footer class="main-footer">
            <p><strong>JEREMIAS PUCA</strong></p>
            <p><strong>2026</strong></p>
        </footer>
    </main>

</body>
</html>
